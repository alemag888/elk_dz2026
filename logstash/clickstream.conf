input {
  file {
    path => "/app/weblog.csv"
    start_position => "beginning"
    sincedb_path => "/dev/null"
  }
}

filter {
  if [message] == "IP,Time,URL,Status" {
    drop {}
  }

  csv {
    separator => ","
    columns => ["IP", "Time", "URL", "Status"]
  }

  mutate {
    gsub => [
      "Time", "^\[", ""
    ]

    convert => {
      "Status" => "integer"
    }
  }

  date {
    match => ["Time", "dd/MMM/yyyy:HH:mm:ss"]
    locale => "en"
    timezone => "UTC"
    target => "@timestamp"
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "weblogs"
  }

  stdout {
    codec => rubydebug
  }
}
